# Prompt cluster template — Brand Prompt Framework
# =================================================
# Usage:
#   1. Copy this file to prompts/<cluster>.yaml (e.g. prompts/sustainability.yaml)
#   2. Set `cluster` to the same name as the file (without .yaml)
#   3. Register the cluster in config.yaml under `prompt_clusters`
#   4. Fill in 10-15 prompts per cluster (framework Phase 3)
#
# Required fields per prompt: id, text (everything the pipeline needs).
# Optional metadata fields (type, prompt_family, journey, funnel_stage,
# buyer_persona, context_sentence, evaluation, competitors_in_topic,
# target_page, catalog_ref, buying_context, customer_evidence, motive_color)
# document the framework mapping — they are ignored by src/collector.py but
# keep the prompt set auditable and versionable.
#
# Rules (framework Phase 3.2):
#   - W-question or natural buyer query, user perspective (first person works well)
#   - One aspect per prompt, no yes/no or leading questions
#   - Target-market language (German prompts -> German-market visibility)
#   - Type A prompts must NOT contain any brand name
#
# IMPORTANT: Only Type A (generic) prompts belong in clusters that feed the
# mention-rate pipeline. Keep Type B (branded) prompts in separate clusters
# and analyze them as perception data, never as organic visibility.
#
# Buying context and constraint sets are part of the measurement instrument.
# Keep them stable for paired comparisons and report them with the results.
#
# v1.1 (framework 3.3, 3.7, 3.8):
#   - context_sentence: the persona as ONE fixed sentence placed before the
#     question; identical across runs. Control groups: null.
#   - evaluation: generic | feature | seasonal | control | brand | benchmark |
#     reserve | service. Feature prompts (brand attributes in the text) and
#     seasonal prompts are reported separately, never merged into the generic rate.
#   - competitors_in_topic: roster brands whose product_fields intersect the
#     topic's fields (framework 1.5). All roster brands count for detection.
#   - target_page: verified URL that should be cited; null = content gap, keep flagged.
#   - IDs are append-only. Never renumber after the first measured run.
# Optional: customer evidence can improve prompt realism. Aggregate or anonymize
# it before it informs prompts.

cluster: CLUSTER_NAME
description: "Short description incl. persona, e.g. 'Sustainability queries from a fashion-conscious 30-year-old, first person'"

prompts:
  - id: xxx_a_01              # <cluster-prefix>_<type>_<number>
    text: "Welche Schmuckmarken setzen auf recyceltes Gold?"
    type: A                   # A = generic (no brand) | B = branded
    prompt_family: generic    # generic | contextual | branded | mixed
    journey: awareness        # awareness | consideration | decision | retention | advocacy
    funnel_stage: bedarf      # Neuro-SEO stages: bedarf | vergleich | anwendung | kauf | nachkauf (framework 2.2)
    buyer_persona: "fashion-conscious 30-year-old customer"
    context_sentence: "Ich bin 30, achte auf Herkunft und Materialien und suche Schmuck, den ich täglich tragen kann."
    evaluation: generic       # generic | feature | seasonal | control | brand | benchmark | reserve | service
    competitors_in_topic: ["Brand A", "Brand B"]   # from the roster via product fields
    target_page: "https://example.com/collections/recycled-gold"   # verified, never reconstructed
    catalog_ref: null         # client's own catalog number, if any
    buying_context:
      market: "DACH"
      company_or_household_context: null
      industry_or_use_case: "jewelry purchase"
      existing_systems: []
      constraints:
        - "sustainability matters"
      admitted_solution_classes:
        - "jewelry brands with recycled materials"
      excluded_solution_classes: []
    customer_evidence:        # optional recommendation, not required by pipeline
      sources:
        - "customer_questionnaire"
        - "on_site_faq"
      recurring_questions:
        - "Which brands use recycled materials?"
      objections:
        - "unclear material origin"
      decision_criteria:
        - "sustainability"
        - "trust"
      privacy_note: "Aggregated and anonymized; no customer names or confidential details in prompt text."

  - id: xxx_a_02
    text: "Wer sind die führenden Anbieter für nachhaltigen Schmuck in Deutschland?"
    type: A
    prompt_family: generic
    journey: consideration
    buyer_persona: "fashion-conscious 30-year-old customer"

  - id: xxx_a_03
    text: "Ich möchte nachhaltigen Schmuck kaufen. Wo finde ich vertrauenswürdige Anbieter?"
    type: A
    prompt_family: generic
    journey: decision
    buyer_persona: "fashion-conscious 30-year-old customer"

  # Optional: motive-color framed variant (Neuro-SEO extension)
  - id: xxx_a_04
    text: "Welche Schmuckmarken kann ich bedenkenlos verschenken, ohne bei Qualität Kompromisse einzugehen?"
    type: A
    prompt_family: generic
    journey: decision
    buyer_persona: "gift buyer who values quality and trust"
    motive_color: blau        # rot | gelb | gruen | blau (Motivkompass, optional)
